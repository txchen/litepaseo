# Publishes litepaseo to npm when a GitHub Release is published, or on demand for an existing
# release tag. Ordinary commits, pushes, pull requests and bare tags never publish.
#
# Authentication is npm Trusted Publishing (OIDC): npmjs.com trusts this repository and this
# workflow file name, and each run receives a short-lived credential. No npm token is stored.
# Renaming this file or the repository requires updating the Trusted Publisher on npmjs.com.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.6.4)
        required: true
        type: string
      dry_run:
        description: Build and pack without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11

      - name: Check the tag matches package.json
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          # A dry run still builds and tests an already published version.
          if [ "$DRY_RUN" != "true" ] && npm view "litepaseo@$version" version >/dev/null 2>&1; then
            echo "::notice::litepaseo@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Dry runs also check that npmjs.com trusts this workflow: the same OIDC exchange npm
      # publish performs, without publishing. The short-lived npm token is never printed.
      - name: Check npm Trusted Publishing
        if: inputs.dry_run
        run: |
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/litepaseo)
          if [ "${status:0:1}" = 2 ] && jq -e '.token | length > 0' exchange.json >/dev/null; then
            echo "npm Trusted Publishing accepts this workflow."
            rm -f exchange.json
          else
            echo "::error::npm rejected the OIDC exchange (HTTP $status): $(jq -r '.message // .error // empty' exchange.json 2>/dev/null)"
            rm -f exchange.json
            exit 1
          fi

      - if: steps.version.outputs.published != 'true'
        run: npm ci

      - if: steps.version.outputs.published != 'true'
        run: npm run typecheck

      # The CLI lifecycle tests run the built dist/server/cli.mjs.
      - if: steps.version.outputs.published != 'true'
        run: npm run build

      - if: steps.version.outputs.published != 'true'
        run: npm test

      # prepack builds dist/ (web + server) before packing. A dry run only packs: npm refuses
      # even a dry-run publish of a version that is already on the registry.
      - if: steps.version.outputs.published != 'true' && inputs.dry_run
        run: npm pack --dry-run

      - if: steps.version.outputs.published != 'true' && !inputs.dry_run
        run: npm publish
